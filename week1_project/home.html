
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

    <main class="home-container">

        <!-- 第一部分：自我介绍 -->
        <section class="profile">
            <h1>欢迎来到我的个人主页</h1>
            <h2>关于我</h2>
            <p>你好！我是一名正在学习前端开发的大学生。</p>
            <p>我喜欢编程、探索新技术，也希望通过这个项目提升自己的开发能力。</p>
        </section>

        <!-- 第二部分：轮播图 -->
        
<section class="carousel">
    <h2>我的校园生活</h2>

    <img
        id="carousel-image"
        src="images/草地音乐节.jpg"
        alt="草地音乐节"
    >

    <p id="carousel-caption">草地音乐节</p>
</section>


        <!-- 第三部分：留言板 -->
        <section class="message-board">
            <h2>留言板</h2>

            <textarea id="message-input"
                      placeholder="写下你想说的话"></textarea>

            <button id="message-button">发布留言</button>

            <div id="message-list"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
